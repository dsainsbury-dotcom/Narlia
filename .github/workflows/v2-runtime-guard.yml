name: V2 manual integrity check

# Legacy V2 guard retained as an on-demand diagnostic only.
# Automatic release validation and stable backup are handled by
# validate-infographic-release.yml and create-stable-backup.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narlia-v2-manual-integrity-check
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate live launcher
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "Narlia's World" index.html
          if [[ -f launch-20260825.html ]]; then
            index_build=$(grep -o "const build='[^']*'" index.html | head -1 | cut -d"'" -f2)
            launch_build=$(grep -o "const build='[^']*'" launch-20260825.html | head -1 | cut -d"'" -f2)
            test -n "$index_build"
            test "$index_build" = "$launch_build"
          fi

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data*.js gpx-live-data*.js infographic*.js journey*.js *-photo-data.js profile-logo.js)
          for f in "${files[@]}"; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Check GPX overlays for duplicate build declarations
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in gpx-live-data-*.js; do
            count=$(grep -c "const B=" "$f" || true)
            test "$count" -le 1
          done

      - name: Report success
        shell: bash
        run: |
          echo "### Narlia manual integrity check passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Automatic backups remain handled by the dedicated stable-backup workflow." >> "$GITHUB_STEP_SUMMARY"
