name: Extract dashboard source
on:
  push:
    paths:
      - '.github/workflows/extract-dashboard.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode current dashboard
        run: |
          python - <<'PY'
          import base64,gzip,pathlib
          raw=(pathlib.Path('dashboard-part1.b64').read_text().strip()+pathlib.Path('dashboard-part2.b64').read_text().strip())
          html=gzip.decompress(base64.b64decode(raw)).decode('utf-8')
          pathlib.Path('dashboard-source.html').write_text(html)
          print('decoded',len(html),'characters')
          PY
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-source.html
          git commit -m "Temporary dashboard source for infographic update" || exit 0
          git push
