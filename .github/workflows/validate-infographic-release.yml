name: Validate infographic release
on:
  push:
    branches: [main]
    paths:
      - 'infographic-toggle.js'
      - 'infographic-layout-fix.js'
      - 'profile-logo.js'
      - 'profile-logo-fix.js'
      - 'gpx-live-data*.js'
      - 'live-bindings.js'
      - 'index.html'
      - 'launch-20260825.html'
      - '.github/workflows/validate-infographic-release.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check infographic-toggle.js
          node --check infographic-layout-fix.js
          node --check profile-logo.js
          node --check profile-logo-fix.js
          node --check live-bindings.js
          for f in gpx-live-data*.js; do node --check "$f"; done
      - name: Validate release wiring
        shell: bash
        run: |
          grep -q 'Recent (7 Days)' infographic-toggle.js
          grep -q 'All Time' infographic-toggle.js
          grep -q 'latestDays' infographic-toggle.js
          grep -q 'day:' infographic-toggle.js
          grep -q 'gpx-live-data.js' index.html
          grep -q 'gpx-live-data-20260827.js' index.html
          grep -q 'gpx-live-data-20260828.js' index.html
          grep -q 'gpx-live-data-20260829.js' index.html
          grep -q 'infographic-toggle.js' index.html
          grep -q 'infographic-layout-fix.js' index.html
          grep -q 'profile-logo.js' index.html
          grep -q 'profile-logo-fix.js' index.html
          grep -q 'live-bindings.js' index.html
          grep -q 'gpx-live-data.js' launch-20260825.html
          grep -q 'gpx-live-data-20260827.js' launch-20260825.html
          grep -q 'gpx-live-data-20260828.js' launch-20260825.html
          grep -q 'gpx-live-data-20260829.js' launch-20260825.html
          grep -q 'infographic-layout-fix.js' launch-20260825.html
          grep -q 'profile-logo-fix.js' launch-20260825.html
          grep -q 'live-bindings.js' launch-20260825.html
          index_build=$(grep -o "const build='[^']*'" index.html | head -1 | cut -d"'" -f2)
          launch_build=$(grep -o "const build='[^']*'" launch-20260825.html | head -1 | cut -d"'" -f2)
          test -n "$index_build"
          test "$index_build" = "$launch_build"
          test "$index_build" = "20260829-dailytabs-overlap-profilefix-1"
          grep -q "const B='20260829-gpx10-1'" gpx-live-data-20260829.js
          grep -q "export (10).gpx" gpx-live-data-20260829.js
          grep -q "NARLIA_GPX_BUILD" gpx-live-data-20260829.js
          grep -q "NARLIA_BINDINGS_BUILD" live-bindings.js
          grep -q "20260829-dailytabs-overlap-profilefix-1" infographic-toggle.js
          grep -q "20260829-overlapfix-2" infographic-layout-fix.js
          grep -q "20260829-profilefix-1" profile-logo-fix.js
          echo "Daily tabs, overlap guard, profile photo guard, GPX export 10 and live bindings validated: $index_build"
