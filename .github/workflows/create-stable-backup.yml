name: Create stable backup

on:
  workflow_dispatch:
    inputs:
      label:
        description: Optional backup label
        required: false
        default: manual
  workflow_run:
    workflows: ["Validate infographic release"]
    types: [completed]

permissions:
  contents: write

jobs:
  backup:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve commit
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "reason=validated" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "reason=${{ inputs.label }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Create immutable stable tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Narlia Backup Bot"
          git config user.email "actions@users.noreply.github.com"
          stamp=$(date -u +'%Y%m%d-%H%M%S')
          short=$(git rev-parse --short=8 HEAD)
          tag="stable-${stamp}-${short}"
          reason="${{ steps.target.outputs.reason }}"
          git tag -a "$tag" -m "Narlia stable backup\nCommit: $(git rev-parse HEAD)\nReason: $reason\nCreated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin "$tag"
          echo "Created backup tag: $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
