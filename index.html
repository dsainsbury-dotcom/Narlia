<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Narlia's World</title><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div id="status" style="font-family:Arial;padding:20px">Loading Narlia's World…</div><script>(async()=>{try{const r=await fetch('packed.html?v=2',{cache:'no-store'});if(!r.ok)throw new Error('Could not fetch packed dashboard ('+r.status+')');const t=await r.text();const m=t.match(/const b64=`([\s\S]*?)`/);if(!m)throw new Error('Packed dashboard data not found');const clean=m[1].replace(/[^A-Za-z0-9+/=]/g,'');if(!clean)throw new Error('Packed dashboard data is empty');const bin=Uint8Array.from(atob(clean),c=>c.charCodeAt(0));const txt=new TextDecoder().decode(pako.ungzip(bin));if(!txt.toLowerCase().includes('<!doctype html'))throw new Error('Decoded dashboard is invalid');document.open();document.write(txt);document.close();}catch(e){document.getElementById('status').innerHTML='<h2>Narlia\'s World could not load</h2><p>'+String(e.message||e)+'</p><p>Please refresh or try another browser.</p>';}})();</script></body></html>
