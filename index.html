<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Narlia's World</title>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
<div id="status" style="font-family:Arial,sans-serif;padding:24px">Loading Narlia's World...</div>
<script>
(async function(){
  try {
    const build='20260830-directembeddedprofile-6';
    const urls=['dashboard-part1.b64?v='+build,'dashboard-part2.b64?v='+build];
    const parts=[];
    for(const url of urls){
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error('Could not load '+url+' ('+r.status+')');
      const part=(await r.text()).trim();
      if(!part) throw new Error(url+' is empty');
      parts.push(part);
    }
    const raw=parts.join('');
    if(raw.length!==37104) throw new Error('Dashboard payload incomplete: '+raw.length+' of 37104 characters loaded');
    if(raw.length%4!==0) throw new Error('Dashboard payload alignment is invalid');
    if(!window.pako) throw new Error('Dashboard decompression library did not load');
    const bin=Uint8Array.from(atob(raw),c=>c.charCodeAt(0));
    let txt=new TextDecoder().decode(pako.ungzip(bin));
    if(!/^\s*<!doctype html/i.test(txt)) throw new Error('Decoded dashboard is invalid');
    if(!txt.includes('24 Aug 2026')) throw new Error('Dashboard base date check failed');

    let profileSrc='';
    const pr=await fetch('profile-logo.js?v='+build,{cache:'no-store'});
    if(pr.ok){
      const ptxt=await pr.text();
      const pm=ptxt.match(/const src='(data:image\/jpeg;base64,[^']+)'/);
      if(pm) profileSrc=pm[1];
    }
    const avatarScript=profileSrc ? `<script>(function(){const src=${JSON.stringify(profileSrc)};function a(){document.querySelectorAll('.logo,.petavatar').forEach(el=>{el.replaceChildren();el.style.setProperty('overflow','hidden','important');el.style.setProperty('padding','0','important');el.style.setProperty('background','none','important');const im=document.createElement('img');im.src=src;im.alt='Narlia';im.style.cssText='width:100%;height:100%;object-fit:cover;object-position:center;display:block;border-radius:50%';el.appendChild(im);});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',a);else a();[100,400,1000,2500].forEach(ms=>setTimeout(a,ms));})();<\/script>` : '';

    txt=txt.replace('</body>','<script src="dante-photo-data.js?v='+build+'"><\/script><script src="journey-patch.js?v='+build+'"><\/script><script src="gpx-live-data.js?v='+build+'"><\/script><script src="gpx-live-data-20260827.js?v='+build+'"><\/script><script src="gpx-live-data-20260828.js?v='+build+'"><\/script><script src="gpx-live-data-20260829.js?v='+build+'"><\/script><script src="infographic-toggle.js?v='+build+'"><\/script><script src="infographic-layout-fix.js?v='+build+'"><\/script>'+avatarScript+'<script src="ui-runtime-fixes.js?v='+build+'"><\/script><script src="daily-explorer-fix.js?v='+build+'"><\/script><script src="live-bindings.js?v='+build+'"><\/script></body>');
    document.open();
    document.write(txt);
    document.close();
  } catch(e) {
    document.getElementById('status').innerHTML='<h2>Narlia\'s World could not load</h2><p>'+String(e.message||e)+'</p><p>Please send this exact message to Darren.</p>';
  }
})();
</script>
</body>
</html>
