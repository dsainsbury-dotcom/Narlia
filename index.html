<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Narlia's World</title><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div id="status" style="font-family:Arial;padding:20px">Loading Narlia's World…</div><script>(async()=>{try{const r=await fetch('dashboard.b64?v=3',{cache:'no-store'});if(!r.ok)throw new Error('Could not fetch dashboard data ('+r.status+')');const raw=(await r.text()).trim().replace(/\s+/g,'');if(raw.length%4!==0)throw new Error('Dashboard data length is invalid');const bin=Uint8Array.from(atob(raw),c=>c.charCodeAt(0));const txt=new TextDecoder().decode(pako.ungzip(bin));if(!/^\s*<!doctype html/i.test(txt))throw new Error('Decoded dashboard is invalid');document.open();document.write(txt);document.close();}catch(e){document.getElementById('status').innerHTML='<h2>Narlia\'s World could not load</h2><p>'+String(e.message||e)+'</p><p>Please refresh or try another browser.</p>';}})();</script></body></html>
