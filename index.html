<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Narlia's World</title><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div id="status" style="font-family:Arial;padding:20px">Loading Narlia's World…</div><script>(async()=>{try{const t=await (await fetch('packed.html',{cache:'no-store'})).text();const m=t.match(/const b64=`([^`]+)`/);if(!m)throw new Error('Packed dashboard data not found');const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));const txt=new TextDecoder().decode(pako.ungzip(bin));document.open();document.write(txt);document.close();}catch(e){document.getElementById('status').innerHTML='<h2>Narlia\'s World could not load</h2><p>'+String(e.message||e)+'</p><p>Please refresh or try another browser.</p>';}})();</script></body></html>
