<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Narlia's World</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07111b;color:#eef5fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    #loading,#error{max-width:720px;margin:15vh auto;padding:24px;text-align:center}
    #error{display:none}.muted{color:#9fb0c0}
  </style>
</head>
<body>
<div id="loading"><h1>Narlia's World</h1><p class="muted">Loading dashboard...</p></div>
<div id="error"><h1>Narlia's World could not load</h1><p id="errorText"></p><p class="muted">Please refresh the page.</p></div>
<script>
(async()=>{
  try{
    const r=await fetch('dashboard-shell.html?v=2026-08-25-loader-fix-1',{cache:'no-store'});
    if(!r.ok) throw new Error('Dashboard shell did not load');
    let txt=await r.text();
    if(!/^\s*<!doctype html/i.test(txt)) throw new Error('Dashboard shell is invalid');
    txt=txt.replace('</body>','<script src="dante-photo-data.js?v=repair-1"><\/script><script src="journey-patch.js?v=2026-08-25-2"><\/script></body>');
    document.open();
    document.write(txt);
    document.close();
  }catch(e){
    document.getElementById('loading').style.display='none';
    document.getElementById('error').style.display='block';
    document.getElementById('errorText').textContent=e&&e.message?e.message:String(e);
  }
})();
</script>
</body>
</html>
